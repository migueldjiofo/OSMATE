[project]
name = "osmate-backend"
version = "0.1.0"
description = "Backend fuer OSMATE - einen agentenbasierten raeumlichen Assistenten fuer OpenStreetMap"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []